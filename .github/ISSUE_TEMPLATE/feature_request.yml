name: Feature Request
description: Suggest a feature or enhancement for MitchVault Sync
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe what you'd like to see.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve? Is there a workaround today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you'd like to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you've thought about?

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: Attachment sync (files)
        - label: Bidirectional sync
        - label: Organization / collection sync
        - label: Incremental / delta sync
        - label: Webhook / real-time trigger
        - label: Multi-user support
        - label: Other (describe below)

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else relevant?
