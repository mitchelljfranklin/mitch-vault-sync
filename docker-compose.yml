services:
  mitchvault-sync:
    build:
      context: .
      args:
        BW_VERSION: "2026.6.0"
    container_name: mitchvault-sync
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
