# ── MitchVault Sync — Docker Compose ────────────────────────────────────────
#
# One-way Vaultwarden -> Bitwarden vault synchronization.
#
# Two ways to run:
#   1. Prebuilt image (recommended): just run
#        docker compose pull && docker compose up -d
#   2. Build locally from source: comment out "image" below, uncomment the
#      "build" section, then run
#        docker compose up -d --build
#
# Setup: fill in your values in the "environment" block below, then start.
# There is no separate environment file required. If you prefer keeping
# secrets out of this file, replace any literal value with a ${VAR_NAME}
# reference and put VAR_NAME=value lines in a .env file next to this one;
# Docker Compose reads that file automatically.

services:
  mitchvault-sync:
    # Multi-arch prebuilt image (linux/amd64 + linux/arm64 — covers x86_64,
    # Raspberry Pi 4/5 on 64-bit OS, Apple Silicon). Pin a release instead of
    # latest for reproducible deployments, e.g. :1.0.0
    image: ghcr.io/mitchelljfranklin/mitch-vault-sync:latest

    # Local build alternative (comment "image" above first):
    # build:
    #   context: .
    #   args:
    #     # Bitwarden CLI version to bake in. Must exist at
    #     # https://github.com/bitwarden/clients/releases with both
    #     # bw-linux-<version>.zip and bw-linux-arm64-<version>.zip assets.
    #     BW_VERSION: "2026.6.0"

    container_name: mitchvault-sync
    restart: unless-stopped

    environment:
      # ── Vaultwarden source (all four required) ────────────────────────────
      VAULTWARDEN_URL: https://vault.example.com
      VAULTWARDEN_MP: your-vaultwarden-master-password
      # Vaultwarden does not support API keys: email/password login is used
      VAULTWARDEN_EMAIL: you@example.com
      VAULTWARDEN_PASSWORD: your-vaultwarden-password

      # ── Bitwarden cloud target ────────────────────────────────────────────
      # API key authenticates login only (Account Settings > Security > Keys)
      BITWARDEN_CLIENT_ID: user.your-client-id
      BITWARDEN_CLIENT_SECRET: your-client-secret
      # Master password is always required to unlock/decrypt after login
      BITWARDEN_MP: your-bitwarden-master-password
      # Region: vault.bitwarden.com (US) or vault.bitwarden.eu (EU)
      BITWARDEN_SERVER: https://vault.bitwarden.com

      # ── Scheduling ────────────────────────────────────────────────────────
      # hourly | daily | 12h | 6h | 4h | 2h | 1h | weekly | 7d |
      # "3:00" or "3:00 Europe/London" (daily at 3 AM)
      SYNC_SCHEDULE: daily
      # Raw cron expression in UTC; wins over SYNC_SCHEDULE when set
      # SYNC_CRON: "0 2 * * *"

      # ── Logging ───────────────────────────────────────────────────────────
      # INFO for phase summaries; DEBUG logs every CLI command (keys masked)
      LOG_LEVEL: INFO

      # ── Healthcheck ───────────────────────────────────────────────────────
      # Container turns unhealthy once the last successful sync is older than
      # this many hours; keep above your schedule interval
      HEALTHCHECK_MAX_AGE_HOURS: "48"

    volumes:
      - ./data:/data

    # Privacy option: keep CLI state and the transient plaintext export in RAM
    # instead of on disk by replacing the volumes block above with:
    #   tmpfs:
    #     - /data
    # Tradeoff: state is lost on every restart, so the container
    # re-authenticates and re-syncs from scratch after each restart.

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # ── Optional hardening (uncomment to enable) ──────────────────────────────
    # Run as a non-root user; uid:gid must own ./data on the host
    # (chown 1000:1000 ./data)
    # user: "1000:1000"
    #
    # Read-only root filesystem; /tmp stays writable via tmpfs
    # read_only: true
    # tmpfs:
    #   - /tmp
    #
    # Drop all Linux capabilities; the container needs none
    # cap_drop:
    #   - ALL
    # security_opt:
    #   - no-new-privileges:true

    # The healthcheck comes baked into the image: it fails once
    # /data/last_sync is older than HEALTHCHECK_MAX_AGE_HOURS,
    # so a broken backup never looks healthy.
